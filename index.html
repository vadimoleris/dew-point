<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Точка росы — калькулятор</title>
<meta name="description" content="Офлайн-калькулятор точки росы: температура, влажность, проверка конденсата на поверхности. Работает без сети.">
<meta name="theme-color" content="#f2f5f0">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Точка росы">
<script>
/* Тема до первой отрисовки — без «вспышки» */
(function(){
  var dark=false;
  try{
    var s=JSON.parse(localStorage.getItem('dewpoint.v1')||'{}');
    dark=s.theme?s.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  }catch(e){dark=matchMedia('(prefers-color-scheme: dark)').matches;}
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=dark?'#0e1512':'#f2f5f0';
})();
</script>
<style>
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#f6faf4;
  --ink:#1f2b23; --muted:#61705f;
  --line:#dfe7db; --track:rgba(31,43,35,.10);
  --green:#2c8a52; --green-ink:#1e6b3d; --green-soft:#e4f2e8;
  --blue:#1f8fd0;  --blue-ink:#0e6ba6;  --blue-soft:#e3f1fa;
  --amber-ink:#8a5a10; --amber-soft:#f9efdb;
  --red:#c94f43; --on-accent:#ffffff;
  --shadow:0 1px 2px rgba(23,42,30,.05),0 10px 30px rgba(23,42,30,.07);
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0e1512; --surface:#151f19; --surface-2:#1a2620;
  --ink:#e7efe8; --muted:#92a595;
  --line:#27372d; --track:rgba(231,239,232,.12);
  --green:#43b573; --green-ink:#7fd6a3; --green-soft:#16301f;
  --blue:#3fa9e0;  --blue-ink:#8fd0f2;  --blue-soft:#12293a;
  --amber-ink:#e5bd75; --amber-soft:#322813;
  --red:#e07a6d; --on-accent:#07130c;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
::selection{background:var(--green-soft)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(900px 480px at 50% -120px,var(--green-soft),transparent 70%),var(--bg);
  color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:430px;margin:0 auto;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;row-gap:8px;padding:6px 2px 14px}
header h1{font-size:19px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap}
.logo{flex:none;display:block}
.header-actions{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.iconbtn:active{transform:scale(.93)}
.iconbtn:disabled{opacity:.4;cursor:default}
#installBtn{height:40px;padding:0 14px;border:none;border-radius:12px;background:var(--green);
  color:var(--on-accent);font-size:13px;font-weight:700;cursor:pointer}
#installBtn:active{transform:scale(.96)}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.opt{font-weight:500;font-size:12px;opacity:.75}
.labelrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.clearbtn{border:none;background:none;color:var(--blue-ink);font-size:12.5px;font-weight:600;cursor:pointer;padding:2px 4px}
.field + .field{margin-top:16px}
.stepper{display:flex;align-items:stretch;height:54px;border:1px solid var(--line);border-radius:14px;
  background:var(--surface-2);overflow:hidden;transition:border-color .15s}
.stepper:focus-within{border-color:var(--green)}
.stepper.invalid{border-color:var(--red)}
.step{flex:0 0 52px;border:none;background:transparent;font-size:26px;font-weight:400;line-height:1;
  cursor:pointer;user-select:none;-webkit-user-select:none}
.step:first-child{border-right:1px solid var(--line)}
.step:last-child{border-left:1px solid var(--line)}
.step:active{background:var(--green-soft)}
.inputwrap{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
.inputwrap input{width:7ch;border:none;background:none;outline:none;padding:0;text-align:right;
  font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.inputwrap input::placeholder{color:var(--muted);opacity:.6}
.unit{font-size:14px;font-weight:600;color:var(--muted);min-width:1.8em}
.result{position:relative;overflow:hidden;padding-top:18px}
.result::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--green),var(--blue))}
.result-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.result-head label{margin:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink)}
.result-value{display:flex;align-items:baseline;gap:8px}
#dew{font-size:clamp(52px,17vw,68px);font-weight:750;letter-spacing:-.02em;line-height:1.05;
  color:var(--blue-ink);font-variant-numeric:tabular-nums}
.result-unit{font-size:24px;font-weight:600;color:var(--muted)}
#copyBtn{margin-left:auto;align-self:center}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
#ahLine{font-size:12.5px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
@keyframes tick{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}
.tick{animation:tick .18s ease-out}
.verdict{margin-top:14px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.verdict.dry{background:var(--green-soft);color:var(--green-ink)}
.verdict.wet{background:var(--blue-soft);color:var(--blue-ink)}
.verdict.edge{background:var(--amber-soft);color:var(--amber-ink)}
.verdict-line{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.verdict-line svg{flex:none}
.verdict .hint{margin-top:0;color:inherit;opacity:.85}
.marginbar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.marginfill{height:100%;border-radius:3px;background:currentColor;width:0;transition:width .25s ease}
footer{margin-top:18px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.6}
#offlineChip{color:var(--green-ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  box-shadow:var(--shadow);max-width:calc(100vw - 32px);z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toastAction{border:none;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
noscript p{padding:16px;text-align:center;color:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <svg class="logo" width="26" height="26" viewBox="0 0 512 512" aria-hidden="true">
      <path d="M84 428C139 253 253 139 428 84C373 259 259 373 84 428Z" fill="var(--green)"/>
      <path d="M104 408 408 104" stroke="var(--surface)" stroke-width="14" stroke-linecap="round" opacity=".55" fill="none"/>
      <g transform="translate(270 167) rotate(-36)">
        <path d="M-80 0C-80 -62 -46 -96 0 -96C46 -96 80 -62 80 0Q0 18 -80 0Z" fill="var(--blue)"/>
        <ellipse cx="-30" cy="-57" rx="19" ry="11" fill="#fff" opacity=".85" transform="rotate(-24 -30 -57)"/>
      </g>
    </svg>
    <h1>Точка росы</h1>
    <div class="header-actions">
      <button id="installBtn" type="button" hidden>Установить</button>
      <button id="themeBtn" class="iconbtn" type="button" aria-label="Переключить тему">
        <svg id="iconMoon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="iconSun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="card" aria-label="Параметры воздуха">
      <div class="field">
        <label for="t">Температура воздуха</label>
        <div class="stepper">
          <button type="button" class="step" data-field="t" data-dir="-1" aria-label="Уменьшить температуру на 0,1"><span aria-hidden="true">−</span></button>
          <div class="inputwrap">
            <input id="t" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="7" value="22,0">
            <span class="unit">°C</span>
          </div>
          <button type="button" class="step" data-field="t" data-dir="1" aria-label="Увеличить температуру на 0,1"><span aria-hidden="true">+</span></button>
        </div>
      </div>
      <div class="field">
        <label for="rh">Относительная влажность</label>
        <div class="stepper">
          <button type="button" class="step" data-field="rh" data-dir="-1" aria-label="Уменьшить влажность на 0,1"><span aria-hidden="true">−</span></button>
          <div class="inputwrap">
            <input id="rh" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="7" value="55,0">
            <span class="unit">%</span>
          </div>
          <button type="button" class="step" data-field="rh" data-dir="1" aria-label="Увеличить влажность на 0,1"><span aria-hidden="true">+</span></button>
        </div>
      </div>
    </section>

    <section class="card result" aria-label="Результат">
      <div class="result-head">
        <label>Точка росы</label>
        <span id="frostBadge" class="badge" hidden>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>
          иней
        </span>
      </div>
      <div class="result-value">
        <span id="dew" aria-live="polite" aria-atomic="true">12,5</span>
        <span class="result-unit">°C</span>
        <button id="copyBtn" class="iconbtn" type="button" aria-label="Скопировать результат" title="Скопировать результат">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <p id="resultHint" class="hint">При охлаждении воздуха до этой температуры начнётся конденсат.</p>
      <p id="ahLine">Влагосодержание воздуха ≈ 10,7 г/м³</p>
    </section>

    <section class="card" aria-label="Проверка поверхности">
      <div class="field">
        <div class="labelrow">
          <label for="s">Температура поверхности <span class="opt">(необязательно)</span></label>
          <button id="clearS" class="clearbtn" type="button" hidden>сбросить</button>
        </div>
        <div class="stepper">
          <button type="button" class="step" data-field="s" data-dir="-1" aria-label="Уменьшить температуру поверхности на 0,1"><span aria-hidden="true">−</span></button>
          <div class="inputwrap">
            <input id="s" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" maxlength="7" placeholder="—">
            <span class="unit">°C</span>
          </div>
          <button type="button" class="step" data-field="s" data-dir="1" aria-label="Увеличить температуру поверхности на 0,1"><span aria-hidden="true">+</span></button>
        </div>
      </div>
      <div id="verdict" class="verdict dry" aria-live="polite" hidden>
        <div class="verdict-line"><span id="verdictIcon"></span><span id="verdictText"></span></div>
        <div class="marginbar" id="marginBar"><div class="marginfill" id="marginFill"></div></div>
        <p class="hint" id="verdictDetail"></p>
      </div>
      <p id="surfaceHint" class="hint">Проверьте, выпадет ли роса на трубе, окне или стене.</p>
    </section>
  </main>

  <footer>
    <p>Формула Магнуса (Alduchov–Eskridge) · ≈ ±0,4 °C при −40…+50 °C</p>
    <p><span id="offlineChip" hidden>✓ работает офлайн</span> · v1.0.1</p>
  </footer>
</div>

<div id="toast" role="status"><span id="toastText"></span><button id="toastAction" type="button" hidden></button></div>
<noscript><p>Для расчёта нужен включённый JavaScript.</p></noscript>

<script>
(function(){
'use strict';
var KEY='dewpoint.v1', A=17.625, B=243.04;
var LIMITS={t:[-60,60],rh:[0,100],s:[-60,60]};
var state={t:22,rh:55,s:null};
var themeChoice=null;
var hadController=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);

var $=function(id){return document.getElementById(id);};
var els={dew:$('dew'),frost:$('frostBadge'),hint:$('resultHint'),ah:$('ahLine'),copy:$('copyBtn'),
  verdict:$('verdict'),vIcon:$('verdictIcon'),vText:$('verdictText'),vDetail:$('verdictDetail'),
  mBar:$('marginBar'),mFill:$('marginFill'),sHint:$('surfaceHint'),clearS:$('clearS'),
  install:$('installBtn'),themeBtn:$('themeBtn'),sun:$('iconSun'),moon:$('iconMoon'),
  toast:$('toast'),toastText:$('toastText'),toastAction:$('toastAction'),offline:$('offlineChip')};

/* ---------- математика ---------- */
function clamp(v,lim){return Math.min(lim[1],Math.max(lim[0],v));}
function round1(x){var r=Math.sign(x)*Math.round(Math.abs(x)*10+1e-9)/10;return Object.is(r,-0)?0:r;}
function fmt(x){return round1(x).toFixed(1).replace('.',',').replace('-','−');}
function parse(str){var s=String(str).trim();if(!s)return null;
  var v=Number(s.replace(',','.').replace(/−/g,'-'));return Number.isFinite(v)?v:null;}
function dewPoint(t,rh){if(rh<=0)return null;
  var g=Math.log(rh/100)+A*t/(B+t);return B*g/(A-g);}
function absHumidity(t,rh){var es=6.112*Math.exp(A*t/(B+t));return 216.7*(es*rh/100)/(273.15+t);}

/* ---------- состояние ---------- */
function loadState(){
  try{
    var raw=JSON.parse(localStorage.getItem(KEY)||'null');if(!raw)return;
    ['t','rh'].forEach(function(k){if(typeof raw[k]==='number'&&isFinite(raw[k]))state[k]=round1(clamp(raw[k],LIMITS[k]));});
    if(raw.s===null||(typeof raw.s==='number'&&isFinite(raw.s)))
      state.s=raw.s==null?null:round1(clamp(raw.s,LIMITS.s));
    if(raw.theme==='light'||raw.theme==='dark')themeChoice=raw.theme;
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({t:round1(state.t),rh:round1(state.rh),
    s:state.s==null?null:round1(state.s),theme:themeChoice}));}catch(e){}
}

/* ---------- иконки вердикта ---------- */
var SVG_OPEN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var ICONS={
  dry:SVG_OPEN+'<circle cx="12" cy="12" r="9.2"/><path d="m8.2 12.4 2.6 2.6 5-5.4"/></svg>',
  wet:SVG_OPEN+'<path d="M12 3.2C12 3.2 6.4 9.6 6.4 13.8a5.6 5.6 0 0 0 11.2 0C17.6 9.6 12 3.2 12 3.2Z"/></svg>',
  frost:SVG_OPEN+'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>',
  edge:SVG_OPEN+'<path d="M12 4 2.8 19.6h18.4L12 4Z"/><path d="M12 10.4v3.6"/><path d="M12 16.9v.1"/></svg>'
};

/* ---------- отрисовка ---------- */
function render(){
  var d=dewPoint(state.t,state.rh), dR=d==null?null:round1(d);
  var txt=dR==null?'—':fmt(dR);
  if(els.dew.textContent!==txt){
    els.dew.textContent=txt;
    els.dew.classList.remove('tick');void els.dew.offsetWidth;els.dew.classList.add('tick');
  }
  els.frost.hidden=!(dR!=null&&dR<0);
  els.hint.textContent=dR==null?'При влажности 0 % точка росы не определена.'
    :(dR<0?'Ниже нуля влага осаждается в виде инея.'
    :'При охлаждении воздуха до этой температуры начнётся конденсат.');
  els.ah.textContent='Влагосодержание воздуха ≈ '+fmt(absHumidity(state.t,state.rh))+' г/м³';
  els.copy.disabled=dR==null;
  renderVerdict(dR);
  save();
}
function renderVerdict(dR){
  els.clearS.hidden=state.s==null;
  if(state.s==null||dR==null){els.verdict.hidden=true;els.sHint.hidden=false;return;}
  els.sHint.hidden=true;els.verdict.hidden=false;
  var sR=round1(state.s), delta=round1(sR-dR), cls,icon,title,detail;
  if(delta>0){cls='dry';icon=ICONS.dry;title='Сухо — конденсата не будет';
    detail='Поверхность теплее точки росы на '+fmt(delta)+' °C.';}
  else if(delta<0){var frost=sR<0;cls='wet';icon=frost?ICONS.frost:ICONS.wet;
    title=frost?'Иней на поверхности':'Конденсат на поверхности';
    detail='Поверхность холоднее точки росы на '+fmt(-delta)+' °C.';}
  else{cls='edge';icon=ICONS.edge;title='Граница конденсации';
    detail='Поверхность точно на точке росы — влага выпадет при малейшем охлаждении.';}
  els.verdict.className='verdict '+cls;
  els.vIcon.innerHTML=icon;
  els.vText.textContent=title;
  els.vDetail.textContent=detail;
  els.mBar.hidden=delta===0;
  els.mFill.style.width=(Math.min(Math.abs(delta)/10,1)*100).toFixed(0)+'%';
}

/* ---------- поля ввода ---------- */
function display(id){var inp=$(id);inp.value=state[id]==null?'':fmt(state[id]);}
function step(id,dir,amount){
  var base=state[id];
  if(base==null)base=(id==='s')?round1(state.t):0;
  var next=round1(clamp(round1(base)+dir*amount,LIMITS[id]));
  state[id]=next;display(id);
  $(id).closest('.stepper').classList.remove('invalid');
  render();
}
function setupField(id,nullable){
  var input=$(id), wrap=input.closest('.stepper');
  input.addEventListener('input',function(){
    var raw=input.value, v=parse(raw);
    if(v==null){
      if(nullable&&raw.trim()===''){state.s=null;wrap.classList.remove('invalid');render();}
      else wrap.classList.remove('invalid');
      return;
    }
    if(v<LIMITS[id][0]||v>LIMITS[id][1]){wrap.classList.add('invalid');return;}
    wrap.classList.remove('invalid');
    state[id]=v;render();
  });
  input.addEventListener('blur',function(){
    var raw=input.value, v=parse(raw);
    if(v==null){
      if(nullable&&raw.trim()==='')state.s=null;
      display(id);
    }else{
      state[id]=round1(clamp(v,LIMITS[id]));
      display(id);
    }
    wrap.classList.remove('invalid');render();
  });
  input.addEventListener('focus',function(){input.select();});
  input.addEventListener('keydown',function(e){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      e.preventDefault();step(id,e.key==='ArrowUp'?1:-1,e.shiftKey?1:0.1);
    }else if(e.key==='Enter'){e.preventDefault();input.blur();}
  });
}
function bindStepButton(btn){
  var id=btn.dataset.field, dir=Number(btn.dataset.dir), t=null, i=null;
  function fire(){step(id,dir,0.1);}
  function stop(){clearTimeout(t);clearInterval(i);t=i=null;}
  btn.addEventListener('pointerdown',function(e){
    e.preventDefault();stop();fire();
    t=setTimeout(function(){i=setInterval(fire,75);},450);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){btn.addEventListener(ev,stop);});
  btn.addEventListener('click',function(e){if(e.detail===0)fire();}); /* клавиатура */
  btn.addEventListener('contextmenu',function(e){e.preventDefault();});
}
['t','rh','s'].forEach(function(id){setupField(id,id==='s');});
Array.prototype.forEach.call(document.querySelectorAll('.step'),bindStepButton);
els.clearS.addEventListener('click',function(){state.s=null;display('s');render();});

/* ---------- тост ---------- */
var toastTimer=null;
function hideToast(){els.toast.classList.remove('show');}
function showToast(msg,actionLabel,cb){
  els.toastText.textContent=msg;
  if(actionLabel){
    els.toastAction.hidden=false;els.toastAction.textContent=actionLabel;
    els.toastAction.onclick=function(){hideToast();if(cb)cb();};
  }else{els.toastAction.hidden=true;els.toastAction.onclick=null;}
  els.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(hideToast,actionLabel?8000:2200);
}

/* ---------- копирование ---------- */
function copyFallback(txt){
  var ta=document.createElement('textarea');
  ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-100px;opacity:0';
  document.body.appendChild(ta);ta.select();
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();return ok;
}
els.copy.addEventListener('click',function(){
  var d=dewPoint(state.t,state.rh);if(d==null)return;
  var dR=round1(d);
  var txt='Точка росы: '+fmt(dR)+' °C — воздух '+fmt(state.t)+' °C, влажность '+fmt(state.rh)+' %';
  if(state.s!=null){
    var sR=round1(state.s),delta=round1(sR-dR);
    txt+='; поверхность '+fmt(sR)+' °C — '+(delta>0?'сухо (запас '+fmt(delta)+' °C)'
      :delta<0?(sR<0?'иней':'конденсат'):'граница конденсации');
  }
  var done=function(ok){showToast(ok?'Скопировано':'Не удалось скопировать');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(copyFallback(txt));});
  }else done(copyFallback(txt));
});

/* ---------- тема ---------- */
var mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  var dark=themeChoice?themeChoice==='dark':mq.matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.querySelector('meta[name="theme-color"]').content=dark?'#0e1512':'#f2f5f0';
  els.sun.hidden=!dark;els.moon.hidden=dark;
  els.themeBtn.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');
}
els.themeBtn.addEventListener('click',function(){
  var dark=document.documentElement.dataset.theme==='dark';
  themeChoice=dark?'light':'dark';applyTheme();save();
});
if(mq.addEventListener)mq.addEventListener('change',function(){if(!themeChoice)applyTheme();});

/* ---------- установка PWA ---------- */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();deferredPrompt=e;els.install.hidden=false;
});
els.install.addEventListener('click',function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){deferredPrompt=null;els.install.hidden=true;});
});
window.addEventListener('appinstalled',function(){els.install.hidden=true;showToast('Приложение установлено ✓');});

/* ---------- сервис-воркер ---------- */
function offerUpdate(reg){
  showToast('Доступна новая версия','Обновить',function(){
    if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
  });
}
function initSW(){
  if(!('serviceWorker' in navigator)||!/^https?:$/.test(location.protocol))return;
  navigator.serviceWorker.register('./sw.js').then(function(reg){
    navigator.serviceWorker.ready.then(function(){els.offline.hidden=false;});
    if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg);
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(reg);
      });
    });
  }).catch(function(){});
  var reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(hadController&&!reloading){reloading=true;location.reload();}
  });
}
if(document.readyState==='complete')initSW();
else window.addEventListener('load',initSW,{once:true});

/* ---------- старт ---------- */
loadState();
display('t');display('rh');display('s');
applyTheme();
render();
})();
</script>
</body>
</html>
